# Build the container and push it to GitHub's registry.
#
# Runs on every push to main. Nothing to configure — GITHUB_TOKEN is provided
# automatically and already has permission to write packages in this repo.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'deploy/**']
  workflow_dispatch:          # the "Run workflow" button, for a rebuild on demand

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/laserlog

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Tag the image with the version in package.json as well as :latest, so
      # there is always a specific tag to pin or roll back to.
      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 only. Unraid is x86, and building arm64 under emulation would
          # add ten minutes to every run for an image nothing pulls.
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### LaserLog ${{ steps.ver.outputs.version }} pushed"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:latest"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.ver.outputs.version }}"
            echo '```'
            echo ""
            echo "Unraid will offer it as an update within the hour, or hit"
            echo "**Check for Updates** on the Docker tab to see it now."
          } >> "$GITHUB_STEP_SUMMARY"
